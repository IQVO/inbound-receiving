  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string }
        type: { type: string }
        subject: { type: string, description: The aggregate instance id. }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        dataschema: { type: string }

    AsnLineData:
      type: object
      required: [line_no, sku, expected_qty]
      properties:
        line_no: { type: integer, minimum: 1 }
        sku: { type: string }
        expected_qty: { type: integer, minimum: 1 }

    DiscrepancyData:
      type: object
      required: [line_no, sku, kind, expected_qty, received_qty, damaged_qty]
      properties:
        line_no: { type: integer, minimum: 1 }
        sku: { type: string }
        kind: { type: string, enum: [Short, Over, Damaged] }
        expected_qty: { type: integer, minimum: 1 }
        received_qty: { type: integer, minimum: 0, description: Good plus damaged. }
        damaged_qty: { type: integer, minimum: 0 }

    ASNRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [asn_number, supplier_ref, lines]
              properties:
                asn_number: { type: string }
                supplier_ref: { type: string }
                expected_arrival: { type: string, format: date-time, description: Omitted when the supplier gave none. }
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/AsnLineData" }

    ASNCancelledEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [asn_number]
              properties:
                asn_number: { type: string }
                reason: { type: string, description: Omitted when none was given. }

    DockAppointmentBookedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [appointment_id, door_code, carrier, window_start, window_end, asn_numbers]
              properties:
                appointment_id: { type: string }
                door_code: { type: string }
                carrier: { type: string }
                window_start: { type: string, format: date-time }
                window_end: { type: string, format: date-time }
                asn_numbers:
                  type: array
                  minItems: 1
                  items: { type: string }

    DockAppointmentCheckedInEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [appointment_id, door_code, checked_in_at]
              properties:
                appointment_id: { type: string }
                door_code: { type: string }
                checked_in_at: { type: string, format: date-time }

    DockAppointmentCancelledEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [appointment_id, door_code]
              properties:
                appointment_id: { type: string }
                door_code: { type: string }
                reason: { type: string, description: Omitted when none was given. }

    DockAppointmentCompletedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [appointment_id, door_code, completed_at]
              properties:
                appointment_id: { type: string }
                door_code: { type: string }
                completed_at: { type: string, format: date-time }

    ReceiptOpenedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, opened_at]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                appointment_id: { type: string, description: Omitted for a walk-in delivery. }
                door_code: { type: string, description: Omitted when the receipt has no appointment. }
                opened_at: { type: string, format: date-time }

    ReceiptLineReceivedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, line_no, sku, quantity, condition, received_at]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                line_no: { type: integer, minimum: 1 }
                sku: { type: string }
                quantity: { type: integer, minimum: 1 }
                condition: { type: string, enum: [Good, Damaged] }
                received_at: { type: string, format: date-time }

    ReceiptClosedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [receipt_id, asn_number, closed_at, discrepancies]
              properties:
                receipt_id: { type: string }
                asn_number: { type: string }
                closed_at: { type: string, format: date-time }
                discrepancies:
                  type: array
                  description: Empty when everything matched.
                  items: { $ref: "#/components/schemas/DiscrepancyData" }

    ProductRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, description, version]
              properties:
                sku: { type: string }
                description: { type: string }
                version: { type: integer, minimum: 1 }

    LocationSlotRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [locationCode, aisleId, zoneId, locationType, maxWeightKg, maxVolumeM3]
              properties:
                eventName: { type: string }
                eventType: { type: string }
                occurredAt: { type: string, format: date-time }
                locationCode: { type: string }
                aisleId: { type: string }
                zoneId: { type: string }
                locationType: { type: string }
                role: { type: string, description: "Storage, Dock, Yard, WorkCenter, Drop, Staging, QC, Consolidation or Shipping; absent means Storage." }
                dockFlow: { type: string, enum: [Inbound, Outbound, Both], description: Present only when role is Dock. }
                activities: { type: array, items: { type: string }, description: Present only when role is WorkCenter. }
                maxWeightKg: { type: number }
                maxVolumeM3: { type: number }

    LocationSlotDecommissionedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [locationCode]
              properties:
                eventName: { type: string }
                eventType: { type: string }
                occurredAt: { type: string, format: date-time }
                locationCode: { type: string }
