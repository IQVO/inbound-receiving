asyncapi: 2.6.0

info:
  title: inbound-receiving Domain Events
  version: "1.0.0"
  contact:
    name: inbound-receiving maintainers
    url: https://github.com/IQVO/inbound-receiving
    email: inbound-receiving@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event catalog for the **inbound-receiving** bounded context (WMS subdomain):
    the inbound dock workflow of ASNs, dock appointments and receipts
    (ADR 0001, ADR 0002).

    **Published.** The `Asn`, `DockAppointment` and `Receipt` aggregates raise
    nine events, published to `warehouse.inbound-receiving.events` through a
    **transactional outbox**: the aggregate row and its already-encoded events
    are written in ONE database transaction and a relay drains them to Kafka
    (at-least-once; the CloudEvents `id` is stored with the outbox row, so a
    retry republishes the same `id`). Consumers dedupe on `id`.
    `ReceiptLineReceived` is the **handover event**: inventory-storage consumes
    it and books `condition=Good` quantities into stock (ADR 0003); Damaged
    quantities are recorded here and not booked.

    **Consumed (ADR 0003).** `ProductRegistered` from
    `warehouse.product-master.events` feeds the `known_skus` local copy
    (`PRODUCT_MODE`, group from env `PRODUCT_CONSUMER_GROUP`).
    `LocationSlotRegistered` and `LocationSlotDecommissioned` from
    `warehouse.facility.events` feed the `dock_doors` local copy
    (`DOCK_DOOR_MODE`, group from env `DOCK_DOOR_CONSUMER_GROUP`). Both modes
    default to `permissive` (consumer not started); a `kafka` mode with an
    unset group is a boot error.

    **Analytics (ADR 0006).** The same nine events are ALSO written, in the
    same transaction, to `warehouse.inbound-receiving.analytics` with the same
    `type` and the same `id` per occurrence, `dataschema`
    `urn:warehouse:inbound-receiving:analytics:<EventName>:v1` and payloads
    equal to the integration payloads. Only this service's `inbound-projector`
    consumes it; it is not an integration contract.

    **Planned, not built.** warehouse-planning consuming
    `DockAppointmentBooked` as inbound-labor demand is a documented future
    edge. Nothing consumes that event today.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/warehouse/inbound-receiving`), `type`,
    `subject` (the aggregate instance id), `time`, `datacontenttype`
    (`application/json`) and `dataschema`
    (`urn:warehouse:inbound-receiving:events:<EventName>:v1`) are all required.
    `type` = `com.warehouse.wms.inbound-receiving.<entity>.<EventName>` with
    `<entity>` one of `asn`, `dockappointment`, `receipt`. Kafka key:
    `asn_number` for `asn.*` and `receipt.*`, `appointment_id` for
    `dockappointment.*`. `data` is snake_case, optional fields are omitted when
    unset, timestamps are RFC 3339 UTC. A breaking payload change is a new
    `.v2` type, never a mutation.

servers:
  production:
    url: "{brokers}"
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: "kafka.warehouse-systems.internal:9092"

defaultContentType: application/cloudevents+json

tags:
  - name: inbound-receiving
    description: The inbound-receiving bounded context (WMS subdomain).
  - name: asn
    description: Events raised by the Asn aggregate.
  - name: dockappointment
    description: Events raised by the DockAppointment aggregate.
  - name: receipt
    description: Events raised by the Receipt aggregate.
  - name: consumed
    description: Events produced by sibling contexts that this service consumes.
  - name: analytics
    description: This service's own analytics stream, consumed only by its projector (ADR 0006).

channels:
  warehouse.inbound-receiving.events:
    description: |
      This service's integration topic. Written by the outbox relay; every
      message carries the CloudEvents content-type header. Key = `asn_number`
      for ASN and receipt events, `appointment_id` for appointment events.
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`. The
      first consumer is inventory-storage (`ReceiptLineReceived`).
    subscribe:
      operationId: receiveInboundReceivingEvents
      summary: Receive ASN, dock appointment and receipt events.
      description: |
        Subscribe to the inbound dock workflow. Route on the full `type`
        (`com.warehouse.wms.inbound-receiving.<entity>.<EventName>`).
      tags:
        - name: asn
        - name: dockappointment
        - name: receipt
      message:
        oneOf:
          - $ref: "#/components/messages/ASNRegistered"
          - $ref: "#/components/messages/ASNCancelled"
          - $ref: "#/components/messages/DockAppointmentBooked"
          - $ref: "#/components/messages/DockAppointmentCheckedIn"
          - $ref: "#/components/messages/DockAppointmentCancelled"
          - $ref: "#/components/messages/DockAppointmentCompleted"
          - $ref: "#/components/messages/ReceiptOpened"
          - $ref: "#/components/messages/ReceiptLineReceived"
          - $ref: "#/components/messages/ReceiptClosed"

  warehouse.inbound-receiving.analytics:
    description: |
      This service's analytics topic (`AnalyticsTopic` in
      `internal/adapters/outbound/kafka/analytics_encoder.go`; ADR 0006).
      Written by the SAME outbox relay, from rows inserted in the same
      transaction as the integration rows (one CloudEvents `id` per occurrence
      on both topics); key as on the integration topic. Consumed ONLY by this
      service's `inbound-projector` under a fixed consumer group read from env
      `ANALYTICS_CONSUMER_GROUP` (at-least-once; the offset is committed after
      the projection and the dedupe mark committed together in the analytical
      database). The projector dedupes on `id`, ignores unknown types, skips
      (with a rate-limited WARN) anything that is not CloudEvents 1.0, and
      dead-letters a known type with an unusable payload to
      `warehouse.inbound-receiving.analytics.dlq` (raw bytes plus `x-dlq-*`
      headers). Not an integration contract: other contexts consume
      `warehouse.inbound-receiving.events`.
    subscribe:
      operationId: receiveInboundReceivingAnalyticsEvents
      summary: Receive the inbound-receiving analytics events.
      description: |
        Route on the full `type`; the payloads equal the integration payloads
        (no analytics-only fields in v1). `dataschema` is
        `urn:warehouse:inbound-receiving:analytics:<EventName>:v1`.
      tags:
        - name: analytics
      message:
        oneOf:
          - $ref: "#/components/messages/ASNRegisteredAnalytics"
          - $ref: "#/components/messages/ASNCancelledAnalytics"
          - $ref: "#/components/messages/DockAppointmentBookedAnalytics"
          - $ref: "#/components/messages/DockAppointmentCheckedInAnalytics"
          - $ref: "#/components/messages/DockAppointmentCancelledAnalytics"
          - $ref: "#/components/messages/DockAppointmentCompletedAnalytics"
          - $ref: "#/components/messages/ReceiptOpenedAnalytics"
          - $ref: "#/components/messages/ReceiptLineReceivedAnalytics"
          - $ref: "#/components/messages/ReceiptClosedAnalytics"

  warehouse.product-master.events:
    description: |
      product-master's integration topic. Consumed ONLY for `ProductRegistered`
      (ADR 0003), into the `known_skus` local copy, with a stable consumer
      group read from env `PRODUCT_CONSUMER_GROUP`; the consumer is started
      only when `PRODUCT_MODE=kafka`. Every other type on the topic is ignored.
    publish:
      operationId: consumeProductRegistered
      summary: Consume product-master's ProductRegistered.
      description: |
        Upserts the SKU into `known_skus`. The CloudEvents `id` claim and the
        effect commit in one transaction; the offset is committed afterwards.
        Anything that is not a valid CloudEvent is skipped with a WARN.
      tags:
        - name: consumed
      message:
        $ref: "#/components/messages/ProductRegistered"

  warehouse.facility.events:
    description: |
      facility-layout's integration topic. Consumed ONLY for
      `LocationSlotRegistered` and `LocationSlotDecommissioned` (ADR 0003),
      into the `dock_doors` local copy, with a stable consumer group read from
      env `DOCK_DOOR_CONSUMER_GROUP`; the consumer is started only when
      `DOCK_DOOR_MODE=kafka`. Every other type on the topic is ignored. Key =
      `locationCode`.
    publish:
      operationId: consumeDockDoorEvents
      summary: Consume facility-layout's slot registrations and decommissions.
      description: |
        A registration with `role=Dock` and `dockFlow` of `Inbound` or `Both`
        upserts a door; any other registration is ignored. A decommission
        deletes the door of that `locationCode` (a no-op for any other slot).
        The CloudEvents `id` claim and the effect commit in one transaction;
        the offset is committed afterwards.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/LocationSlotRegistered"
          - $ref: "#/components/messages/LocationSlotDecommissioned"

components:
  messages:
    ASNRegistered:
      name: ASNRegistered
      title: ASN registered
      summary: A supplier's advance ship notice was registered.
      description: "`type` = `com.warehouse.wms.inbound-receiving.asn.ASNRegistered`; subject and key = the ASN number."
      contentType: application/cloudevents+json
      tags:
        - name: asn
      payload:
        $ref: "#/components/schemas/ASNRegisteredEvent"
      examples:
        - name: registered
          summary: ASN-1001 with two lines.
          payload:
            specversion: "1.0"
            id: "7c1f3a52-0d4e-4b8a-9e61-2a5d8f0c3b14"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.asn.ASNRegistered"
            subject: "ASN-1001"
            time: "2026-10-08T12:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:ASNRegistered:v1"
            data:
              asn_number: "ASN-1001"
              supplier_ref: "ACME"
              expected_arrival: "2026-10-09T08:00:00Z"
              lines:
                - { line_no: 1, sku: "SKU-1", expected_qty: 40 }
                - { line_no: 2, sku: "SKU-2", expected_qty: 5 }

    ASNCancelled:
      name: ASNCancelled
      title: ASN cancelled
      summary: A Registered ASN was cancelled.
      description: "`type` = `com.warehouse.wms.inbound-receiving.asn.ASNCancelled`; subject and key = the ASN number."
      contentType: application/cloudevents+json
      tags:
        - name: asn
      payload:
        $ref: "#/components/schemas/ASNCancelledEvent"
      examples:
        - name: cancelled
          summary: ASN-1001 cancelled by the supplier.
          payload:
            specversion: "1.0"
            id: "1e9b4d70-3c2a-4f5d-8b17-6a0c9d2e7f31"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.asn.ASNCancelled"
            subject: "ASN-1001"
            time: "2026-10-08T12:30:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:ASNCancelled:v1"
            data:
              asn_number: "ASN-1001"
              reason: "Supplier cancelled the shipment"

    DockAppointmentBooked:
      name: DockAppointmentBooked
      title: Dock appointment booked
      summary: A door window was booked for a carrier.
      description: |
        `type` = `com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentBooked`;
        subject and key = the appointment id. The planned warehouse-planning
        consumer (inbound-labor demand) is not built.
      contentType: application/cloudevents+json
      tags:
        - name: dockappointment
      payload:
        $ref: "#/components/schemas/DockAppointmentBookedEvent"
      examples:
        - name: booked
          summary: A two-hour window at an inbound door covering ASN-1001.
          payload:
            specversion: "1.0"
            id: "4a8c2e91-5b3d-4c7f-a012-9e6d1b8f3c25"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentBooked"
            subject: "appt-123e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-08T12:05:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:DockAppointmentBooked:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              door_code: "WH1-DOCK-IN-01"
              carrier: "ACME Freight"
              window_start: "2026-10-09T08:00:00Z"
              window_end: "2026-10-09T10:00:00Z"
              asn_numbers: ["ASN-1001"]

    DockAppointmentCheckedIn:
      name: DockAppointmentCheckedIn
      title: Dock appointment checked in
      summary: The carrier arrived at the door.
      description: "`type` = `com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentCheckedIn`; subject and key = the appointment id."
      contentType: application/cloudevents+json
      tags:
        - name: dockappointment
      payload:
        $ref: "#/components/schemas/DockAppointmentCheckedInEvent"
      examples:
        - name: checkedIn
          summary: Checked in ten minutes before the window.
          payload:
            specversion: "1.0"
            id: "9d3e5f10-2a4b-4c6d-8e7f-0b1a2c3d4e5f"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentCheckedIn"
            subject: "appt-123e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-09T07:50:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:DockAppointmentCheckedIn:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              door_code: "WH1-DOCK-IN-01"
              checked_in_at: "2026-10-09T07:50:00Z"

    DockAppointmentCancelled:
      name: DockAppointmentCancelled
      title: Dock appointment cancelled
      summary: A Booked appointment was cancelled.
      description: "`type` = `com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentCancelled`; subject and key = the appointment id."
      contentType: application/cloudevents+json
      tags:
        - name: dockappointment
      payload:
        $ref: "#/components/schemas/DockAppointmentCancelledEvent"
      examples:
        - name: cancelled
          summary: Cancelled because the carrier was delayed.
          payload:
            specversion: "1.0"
            id: "b2c4d6e8-1f3a-4b5c-9d7e-8f0a1b2c3d4e"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentCancelled"
            subject: "appt-123e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-08T18:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:DockAppointmentCancelled:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              door_code: "WH1-DOCK-IN-01"
              reason: "Carrier delayed"

    DockAppointmentCompleted:
      name: DockAppointmentCompleted
      title: Dock appointment completed
      summary: The receipt opened from the appointment closed.
      description: |
        `type` = `com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentCompleted`;
        subject and key = the appointment id. Keyed differently from
        `ReceiptClosed` (the ASN number), so their relative order is not
        guaranteed.
      contentType: application/cloudevents+json
      tags:
        - name: dockappointment
      payload:
        $ref: "#/components/schemas/DockAppointmentCompletedEvent"
      examples:
        - name: completed
          summary: Completed when the receipt closed.
          payload:
            specversion: "1.0"
            id: "c3d5e7f9-2a4b-4c6d-8e0f-1a2b3c4d5e6f"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentCompleted"
            subject: "appt-123e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-09T09:30:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:DockAppointmentCompleted:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              door_code: "WH1-DOCK-IN-01"
              completed_at: "2026-10-09T09:30:00Z"

    ReceiptOpened:
      name: ReceiptOpened
      title: Receipt opened
      summary: Receiving of an ASN started.
      description: "`type` = `com.warehouse.wms.inbound-receiving.receipt.ReceiptOpened`; subject = the receipt id, key = the ASN number."
      contentType: application/cloudevents+json
      tags:
        - name: receipt
      payload:
        $ref: "#/components/schemas/ReceiptOpenedEvent"
      examples:
        - name: opened
          summary: A receipt opened from a checked-in appointment.
          payload:
            specversion: "1.0"
            id: "d4e6f8a0-3b5c-4d7e-9f1a-2b3c4d5e6f70"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.receipt.ReceiptOpened"
            subject: "rcpt-223e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-09T08:05:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:ReceiptOpened:v1"
            data:
              receipt_id: "rcpt-223e4567-e89b-12d3-a456-426614174000"
              asn_number: "ASN-1001"
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              door_code: "WH1-DOCK-IN-01"
              opened_at: "2026-10-09T08:05:00Z"

    ReceiptLineReceived:
      name: ReceiptLineReceived
      title: Receipt line received
      summary: A quantity was received against a line (the handover event).
      description: |
        `type` = `com.warehouse.wms.inbound-receiving.receipt.ReceiptLineReceived`;
        subject = the receipt id, key = the ASN number. inventory-storage
        books `condition=Good` quantities with its ReceiveStock use case and
        ignores `Damaged`; it dedupes on the CloudEvents `id`.
      contentType: application/cloudevents+json
      tags:
        - name: receipt
      payload:
        $ref: "#/components/schemas/ReceiptLineReceivedEvent"
      examples:
        - name: good
          summary: 40 good units of SKU-1 received.
          payload:
            specversion: "1.0"
            id: "3f8f6c2e-9b1a-4d6e-8a52-0c7d1e4b9a10"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.receipt.ReceiptLineReceived"
            subject: "rcpt-223e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-09T08:10:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:ReceiptLineReceived:v1"
            data:
              receipt_id: "rcpt-223e4567-e89b-12d3-a456-426614174000"
              asn_number: "ASN-1001"
              line_no: 1
              sku: "SKU-1"
              quantity: 40
              condition: "Good"
              received_at: "2026-10-09T08:10:00Z"

    ReceiptClosed:
      name: ReceiptClosed
      title: Receipt closed
      summary: Receiving ended, with the discrepancies against the ASN.
      description: |
        `type` = `com.warehouse.wms.inbound-receiving.receipt.ReceiptClosed`;
        subject = the receipt id, key = the ASN number. `discrepancies` is
        present and empty when everything matched; a line can appear once per
        kind (`Short`, `Over`, `Damaged`).
      contentType: application/cloudevents+json
      tags:
        - name: receipt
      payload:
        $ref: "#/components/schemas/ReceiptClosedEvent"
      examples:
        - name: closedWithDiscrepancies
          summary: Line 1 short and with damage, line 2 over-received.
          payload:
            specversion: "1.0"
            id: "e5f7a9b1-4c6d-4e8f-a02b-3c4d5e6f7a81"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.receipt.ReceiptClosed"
            subject: "rcpt-223e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-09T09:30:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:ReceiptClosed:v1"
            data:
              receipt_id: "rcpt-223e4567-e89b-12d3-a456-426614174000"
              asn_number: "ASN-1001"
              closed_at: "2026-10-09T09:30:00Z"
              discrepancies:
                - { line_no: 1, sku: "SKU-1", kind: "Short", expected_qty: 40, received_qty: 34, damaged_qty: 4 }
                - { line_no: 1, sku: "SKU-1", kind: "Damaged", expected_qty: 40, received_qty: 34, damaged_qty: 4 }
                - { line_no: 2, sku: "SKU-2", kind: "Over", expected_qty: 5, received_qty: 7, damaged_qty: 0 }

    ASNRegisteredAnalytics:
      name: ASNRegistered
      title: ASN registered (analytics)
      summary: A supplier's advance ship notice was registered, on the analytics stream.
      description: "`type` = `com.warehouse.wms.inbound-receiving.asn.ASNRegistered` (the same as on the integration topic); dataschema `urn:warehouse:inbound-receiving:analytics:ASNRegistered:v1`; payload equal to the integration payload."
      contentType: application/cloudevents+json
      tags:
        - name: analytics
      payload:
        $ref: "#/components/schemas/ASNRegisteredEvent"
      examples:
        - name: analytics
          summary: The analytics copy of the integration example (same id).
          payload:
            specversion: "1.0"
            id: "7c1f3a52-0d4e-4b8a-9e61-2a5d8f0c3b14"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.asn.ASNRegistered"
            subject: "ASN-1001"
            time: "2026-10-08T12:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:analytics:ASNRegistered:v1"
            data:
              asn_number: "ASN-1001"
              supplier_ref: "ACME"
              expected_arrival: "2026-10-09T08:00:00Z"
              lines:
                - { line_no: 1, sku: "SKU-1", expected_qty: 40 }
                - { line_no: 2, sku: "SKU-2", expected_qty: 5 }

    ASNCancelledAnalytics:
      name: ASNCancelled
      title: ASN cancelled (analytics)
      summary: A Registered ASN was cancelled, on the analytics stream.
      description: "`type` = `com.warehouse.wms.inbound-receiving.asn.ASNCancelled` (the same as on the integration topic); dataschema `urn:warehouse:inbound-receiving:analytics:ASNCancelled:v1`; payload equal to the integration payload."
      contentType: application/cloudevents+json
      tags:
        - name: analytics
      payload:
        $ref: "#/components/schemas/ASNCancelledEvent"
      examples:
        - name: analytics
          summary: The analytics copy of the integration example (same id).
          payload:
            specversion: "1.0"
            id: "1e9b4d70-3c2a-4f5d-8b17-6a0c9d2e7f31"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.asn.ASNCancelled"
            subject: "ASN-1001"
            time: "2026-10-08T12:30:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:analytics:ASNCancelled:v1"
            data:
              asn_number: "ASN-1001"
              reason: "Supplier cancelled the shipment"

    DockAppointmentBookedAnalytics:
      name: DockAppointmentBooked
      title: Dock appointment booked (analytics)
      summary: A door window was booked for a carrier, on the analytics stream.
      description: "`type` = `com.warehouse.wms.inbound-receiving.dockappointment.DockAppointmentBooked` (the same as on the integration topic); dataschema `urn:warehouse:inbound-receiving:analytics:DockAppointmentBooked:v1`; payload equal to the integration payload."
