asyncapi: 2.6.0

info:
  title: inbound-receiving Domain Events
  version: "1.0.0"
  contact:
    name: inbound-receiving maintainers
    url: https://github.com/IQVO/inbound-receiving
    email: inbound-receiving@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event catalog for the **inbound-receiving** bounded context (WMS subdomain):
    the inbound dock workflow of ASNs, dock appointments and receipts
    (ADR 0001, ADR 0002).

    **Published.** The `Asn` and `Receipt` aggregates raise seven events,
    published to `warehouse.inbound-receiving.events` through a
    **transactional outbox**: the aggregate row and its already-encoded events
    are written in ONE database transaction and a relay drains them to Kafka
    (at-least-once; the CloudEvents `id` is stored with the outbox row, so a
    retry republishes the same `id`). Consumers dedupe on `id`.
    The four `DockAppointment*` messages below are **LEGACY**: the
    DockAppointment moved to dock-scheduling (ADR 0019, plan YD-0002) and this
    service raises them no more. They stay declared because the stage B
    backfill command (`api republish-appointments`, removed at stage E)
    enqueues them once per stored appointment for dock-scheduling's legacy
    importer, and because earlier ones are still on the topics. Do not
    consume them for new work: read dock-scheduling's events.
    `ReceiptLineReceived` is the **handover event**: inventory-storage consumes
    it and books `condition=Good` quantities into stock (ADR 0003); Damaged
    quantities are recorded here and not booked.

    **Consumed (ADR 0003).** `ProductRegistered` from
    `warehouse.product-master.events` feeds the `known_skus` local copy
    (group from env `PRODUCT_CONSUMER_GROUP`); `ProductPackLevelDeclared` and
    `ProductPackLevelRetired` from the same topic feed the packaging view
    (group from env `PACKAGING_CONSUMER_GROUP`).
    `LocationSlotRegistered` and `LocationSlotDecommissioned` from
    `warehouse.facility.events` feed the `dock_doors` local copy
    (group from env `DOCK_DOOR_CONSUMER_GROUP`). The three consumers always
    run: `PRODUCT_MODE` / `DOCK_DOOR_MODE` accept only `kafka` (or unset) and
    `permissive` / `off` are boot errors, as is an unset group variable.
    `DockAppointmentBooked` and `DockAppointmentCancelled` from
    `warehouse.dock-scheduling.events` feed the `appointments` local copy
    (group from env `DOCK_APPOINTMENT_CONSUMER_GROUP`, ADR 0019), and
    `DockAppointmentRescheduled` / `DockAppointmentDoorReassigned` keep its
    door and window current (ADR 0020): inbound appointments only, guarded by
    dock-scheduling's `version`; applying them publishes nothing. Receipts
    validate their appointment against that copy and take its door when they
    open; an open receipt keeps its door.

    **Analytics (ADR 0006).** The seven events are ALSO written, in the
    same transaction, to `warehouse.inbound-receiving.analytics` with the same
    `type` and the same `id` per occurrence, `dataschema`
    `urn:warehouse:inbound-receiving:analytics:<EventName>:v1` and payloads
    equal to the integration payloads. Only this service's `inbound-projector`
    consumes it; it is not an integration contract. The legacy
    `DockAppointment*` events already on that stream stay projected.

    **Planned.** warehouse-planning reads appointments from dock-scheduling
    (companion of plan YD-0002), not from the legacy messages here.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    Optional W3C trace-context headers (`traceparent`, and `tracestate` /
    `baggage` when present) carry the trace of the request that wrote the
    outbox row (ADR 0009); consumers may extract them, and must not require
    them.
    `specversion`, `id`, `source` (`/warehouse/inbound-receiving`), `type`,
    `subject` (the aggregate instance id), `time`, `datacontenttype`
    (`application/json`) and `dataschema`
    (`urn:warehouse:inbound-receiving:events:<EventName>:v1`) are all required.
    `type` = `com.warehouse.wms.inbound-receiving.<entity>.<EventName>` with
    `<entity>` one of `asn`, `dockappointment`, `receipt`. Kafka key:
    `asn_number` for `asn.*` and `receipt.*`, `appointment_id` for
    `dockappointment.*`. `data` is snake_case, optional fields are omitted when
    unset, timestamps are RFC 3339 UTC. A breaking payload change is a new
    `.v2` type, never a mutation.

servers:
  production:
    url: "{brokers}"
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: "kafka.warehouse-systems.internal:9092"

defaultContentType: application/cloudevents+json

tags:
  - name: inbound-receiving
    description: The inbound-receiving bounded context (WMS subdomain).
  - name: asn
    description: Events raised by the Asn aggregate.
  - name: dockappointment
    description: LEGACY events of the DockAppointment aggregate, which moved to dock-scheduling (ADR 0019); republished once by the stage B backfill.
  - name: receipt
    description: Events raised by the Receipt aggregate.
  - name: consumed
    description: Events produced by sibling contexts that this service consumes.
  - name: analytics
    description: This service's own analytics stream, consumed only by its projector (ADR 0006).

channels:
  warehouse.inbound-receiving.events:
    description: |
      This service's integration topic. Written by the outbox relay; every
      message carries the CloudEvents content-type header (plus the optional
      W3C `traceparent` of the writing request). Key = `asn_number`
      for ASN and receipt events, `appointment_id` for the legacy appointment
      events. Dispatch on the full `type`, ignore unknown types, dedupe on
      `id`. The first consumer is inventory-storage (`ReceiptLineReceived`).
      The `DockAppointment*` messages are LEGACY (ADR 0019): only the
      one-shot `republish-appointments` command writes them now.
    subscribe:
      operationId: receiveInboundReceivingEvents
      summary: Receive ASN and receipt events (and the legacy dock appointment events).
      description: |
        Subscribe to the inbound dock workflow. Route on the full `type`
        (`com.warehouse.wms.inbound-receiving.<entity>.<EventName>`). The
        `dockappointment` messages are LEGACY and only republished by the
        stage B backfill (ADR 0019).
      tags:
        - name: asn
        - name: dockappointment
        - name: receipt
      message:
        oneOf:
          - $ref: "#/components/messages/ASNRegistered"
          - $ref: "#/components/messages/ASNCancelled"
          - $ref: "#/components/messages/DockAppointmentBooked"
          - $ref: "#/components/messages/DockAppointmentCheckedIn"
          - $ref: "#/components/messages/DockAppointmentCancelled"
          - $ref: "#/components/messages/DockAppointmentCompleted"
          - $ref: "#/components/messages/ReceiptOpened"
          - $ref: "#/components/messages/ReceiptLineReceived"
          - $ref: "#/components/messages/ReceiptCartonReceived"
          - $ref: "#/components/messages/CartonDiscrepancyRaised"
          - $ref: "#/components/messages/ReceiptClosed"
          - $ref: "#/components/messages/ReceiptStowCompleted"

  warehouse.inbound-receiving.analytics:
    description: |
      This service's analytics topic (`AnalyticsTopic` in
      `internal/adapters/outbound/kafka/analytics_encoder.go`; ADR 0006).
      Written by the SAME outbox relay, from rows inserted in the same
      transaction as the integration rows (one CloudEvents `id` per occurrence
      on both topics); key as on the integration topic. Consumed ONLY by this
      service's `inbound-projector` under a fixed consumer group read from env
      `ANALYTICS_CONSUMER_GROUP` (at-least-once; the offset is committed after
      the projection and the dedupe mark committed together in the analytical
      database). The projector dedupes on `id`, ignores unknown types, skips
      (with a rate-limited WARN) anything that is not CloudEvents 1.0, and
      dead-letters a known type with an unusable payload to
      `warehouse.inbound-receiving.analytics.dlq` (raw bytes plus `x-dlq-*`
      headers). Not an integration contract: other contexts consume
      `warehouse.inbound-receiving.events`.
    subscribe:
      operationId: receiveInboundReceivingAnalyticsEvents
      summary: Receive the inbound-receiving analytics events.
      description: |
        Route on the full `type`; the payloads equal the integration payloads
        (no analytics-only fields in v1). `dataschema` is
        `urn:warehouse:inbound-receiving:analytics:<EventName>:v1`.
      tags:
        - name: analytics
      message:
        oneOf:
          - $ref: "#/components/messages/ASNRegisteredAnalytics"
          - $ref: "#/components/messages/ASNCancelledAnalytics"
          - $ref: "#/components/messages/DockAppointmentBookedAnalytics"
          - $ref: "#/components/messages/DockAppointmentCheckedInAnalytics"
          - $ref: "#/components/messages/DockAppointmentCancelledAnalytics"
          - $ref: "#/components/messages/DockAppointmentCompletedAnalytics"
          - $ref: "#/components/messages/ReceiptOpenedAnalytics"
          - $ref: "#/components/messages/ReceiptLineReceivedAnalytics"
          - $ref: "#/components/messages/ReceiptCartonReceivedAnalytics"
          - $ref: "#/components/messages/CartonDiscrepancyRaisedAnalytics"
          - $ref: "#/components/messages/ReceiptClosedAnalytics"
          - $ref: "#/components/messages/ReceiptStowCompletedAnalytics"

  warehouse.product-master.events:
    description: |
      product-master's integration topic. `ProductRegistered` feeds the
      `known_skus` local copy (ADR 0003, group from env `PRODUCT_CONSUMER_GROUP`,
      always running); `ProductPackLevelDeclared` and
      `ProductPackLevelRetired` feed the packaging view (group from env
      `PACKAGING_CONSUMER_GROUP`). Every other type on the topic is ignored.
    publish:
      operationId: consumeProductRegistered
      summary: Consume product-master's ProductRegistered.
      description: |
        Upserts the SKU into `known_skus`. The CloudEvents `id` claim and the
        effect commit in one transaction; the offset is committed afterwards.
        Anything that is not a valid CloudEvent is skipped with a WARN.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/ProductRegistered"
          - $ref: "#/components/messages/ProductPackLevelDeclared"
          - $ref: "#/components/messages/ProductPackLevelRetired"

  warehouse.facility.events:
    description: |
      facility-layout's integration topic. Consumed ONLY for
      `LocationSlotRegistered` and `LocationSlotDecommissioned` (ADR 0003),
      into the `dock_doors` local copy, with a stable consumer group read from
      env `DOCK_DOOR_CONSUMER_GROUP`; the consumer always runs. Every other type on the topic is ignored. Key =
      `locationCode`.
    publish:
      operationId: consumeDockDoorEvents
      summary: Consume facility-layout's slot registrations and decommissions.
      description: |
        A registration with `role=Dock` and `dockFlow` of `Inbound` or `Both`
        upserts a door; any other registration is ignored. A decommission
        deletes the door of that `locationCode` (a no-op for any other slot).
        The CloudEvents `id` claim and the effect commit in one transaction;
        the offset is committed afterwards.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/LocationSlotRegistered"
          - $ref: "#/components/messages/LocationSlotDecommissioned"

  warehouse.dock-scheduling.events:
    description: |
      dock-scheduling's integration topic (ADR 0019, 0020, plan YD-0002).
      Consumed ONLY for `DockAppointmentBooked`, `DockAppointmentCancelled`,
      `DockAppointmentRescheduled` and `DockAppointmentDoorReassigned`, into
      the `appointments` local copy, with a stable consumer group read from
      env `DOCK_APPOINTMENT_CONSUMER_GROUP`; the consumer always runs. Every
      other type on the topic (`DockAppointmentNoShow`, check-in, door
      closures, ...) is committed past untouched. Key = `appointment_id`.
      `DockAppointmentDoorReassigned` may not be published on this topic yet;
      the consumer does not depend on it arriving.
    publish:
      operationId: consumeDockAppointmentEvents
      summary: Consume dock-scheduling's appointment bookings, cancellations, reschedules and door reassignments.
      description: |
        A `DockAppointmentBooked` with `direction=INBOUND` upserts the
        appointment (door, carrier, window, ASN numbers); an `OUTBOUND` one is
        ignored. A `DockAppointmentCancelled` marks the stored appointment
        cancelled. A `DockAppointmentRescheduled` moves the stored
        appointment's door and window; a `DockAppointmentDoorReassigned` moves
        its door (ADR 0020). All four are guarded by `version`: an event is
        applied only if its `version` is greater than the stored one (a legacy
        row has version 0, so any dock-scheduling version wins), and no later
        event revives a cancelled appointment. A reschedule or reassignment
        of an appointment that is not in the copy (an `OUTBOUND` one, or one
        not seen yet) is ignored and logged at DEBUG. Receipts already open
        keep their door; receipts opened afterwards take the new one. The
        CloudEvents `id` claim and the effect commit in one transaction; the
        offset is committed afterwards. NO-LOOP: applying an event writes
        nothing to the outbox. A payload that breaks a rule of this context
        is skipped with a WARN, a transient error is retried.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/DockSchedulingAppointmentBooked"
          - $ref: "#/components/messages/DockSchedulingAppointmentCancelled"
          - $ref: "#/components/messages/DockSchedulingAppointmentRescheduled"
          - $ref: "#/components/messages/DockSchedulingAppointmentDoorReassigned"

  warehouse.yard-management.events:
    description: |
      yard-management's integration topic (ADR 0021). Consumed ONLY for
      `VisitCheckedIn`, into the `visit_arrivals` local copy, with a stable
      consumer group read from env `VISIT_ARRIVAL_CONSUMER_GROUP`; the
      consumer always runs. Every other type on the topic (`VisitRejected`,
      `TrailerDocked`, `TrailerDeparted`, ...) is committed past untouched.
      Key = `visit_id`.
    publish:
      operationId: consumeYardVisitEvents
      summary: Consume yard-management's gate arrivals.
      description: |
        A `VisitCheckedIn` carrying an `appointment_id` stores the earliest
        `arrived_at` seen for that appointment (idempotent, order-independent;
        a redelivery or a later duplicate never moves it). A walk-in visit
        (`appointment_id` null) is ignored: there is no receipt to join it
        to. After storing, the use case evaluates the dock-to-stock fact of
        the receipt opened from that appointment (ADR 0021) and may raise
        `ReceiptStowCompleted` through this service's outbox, never anything
        towards yard-management. The CloudEvents `id` claim and the effect
        commit in one transaction; the offset is committed afterwards. A
        payload that breaks a rule of this context is skipped with a WARN, a
        transient error is retried.
      tags:
        - name: consumed
      message:
        $ref: "#/components/messages/YardVisitCheckedIn"

  warehouse.inventory.events:
    description: |
      inventory-storage's integration topic (ADR 0021). Consumed ONLY for
      `ContainerStowed`, into the `carton_stows` local copy, with a stable
      consumer group read from env `CARTON_STOW_CONSUMER_GROUP`; the consumer
      always runs. Every other type on the topic (`ItemStowed`, which has no
      license plate and so cannot be joined to a carton, `CaseBroken`, ...)
      is committed past untouched. Key and subject of `ContainerStowed` = the
      LPN.
    publish:
      operationId: consumeInventoryContainerStowed
      summary: Consume inventory-storage's container stows.
      description: |
        A `ContainerStowed` stores the earliest `at` seen for its `lpn`
        (idempotent, order-independent: a later move of the container to
        another bin is not a new stow). A receipt carton is joined to it by
        its SSCC, which is the `lpn`. After storing, the use case evaluates
        the dock-to-stock fact of the receipts holding that carton (ADR 0021)
        and may raise `ReceiptStowCompleted` through this service's outbox,
        never anything towards inventory-storage. Claim, effect and offset
        follow the same rules as the dock-scheduling consumer.
      tags:
        - name: consumed
      message:
        $ref: "#/components/messages/InventoryContainerStowed"

components:
  messages:
    DockSchedulingAppointmentBooked:
      name: DockAppointmentBooked
      title: dock-scheduling DockAppointmentBooked (consumed)
      summary: dock-scheduling booked (or imported) a dock appointment.
      description: |
        `type` = `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked`,
        source `/warehouse/dock-scheduling`; key and subject = `appointment_id`.
        `data` is snake_case. Only the fields in the schema are read; the rest
        of dock-scheduling's payload (`site_id`, `carrier_scac`, `cpt_id`,
        `shipment_refs`, `expected_seal_number`, `provenance`,
        `arrival_tolerance_minutes`, ...) is ignored.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/DockSchedulingAppointmentBookedEvent"
      examples:
        - name: inbound
          summary: An inbound appointment covering ASN-1001.
          payload:
            specversion: "1.0"
            id: "0b6d1c4e-7a2f-4d83-9e15-3c8a5f7b9d21"
            source: "/warehouse/dock-scheduling"
            type: "com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked"
            subject: "appt-123e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-08T12:05:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:dock-scheduling:events:DockAppointmentBooked:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              site_id: "WH1"
              direction: "INBOUND"
              door_code: "WH1-DOCK-IN-01"
              carrier: "ACME Freight"
              carrier_scac: "ACMF"
              window_start: "2026-10-09T08:00:00Z"
              window_end: "2026-10-09T10:00:00Z"
              asn_numbers: ["ASN-1001"]
              shipment_refs: []
              provenance: "native"
              version: 1
    DockSchedulingAppointmentCancelled:
      name: DockAppointmentCancelled
      title: dock-scheduling DockAppointmentCancelled (consumed)
      summary: dock-scheduling cancelled a dock appointment.
      description: |
        `type` = `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentCancelled`,
        source `/warehouse/dock-scheduling`; key and subject = `appointment_id`.
        Only `appointment_id` and `version` are read.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/DockSchedulingAppointmentCancelledEvent"
      examples:
        - name: cancelled
          summary: The carrier asked to cancel.
          payload:
            specversion: "1.0"
            id: "5e9a3b7c-1d4f-4a60-8b2e-7c0d9f1a3e45"
            source: "/warehouse/dock-scheduling"
            type: "com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentCancelled"
            subject: "appt-123e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-08T13:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:dock-scheduling:events:DockAppointmentCancelled:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              site_id: "WH1"
              door_code: "WH1-DOCK-IN-01"
              reason: "CARRIER_REQUEST"
              version: 2
    DockSchedulingAppointmentRescheduled:
      name: DockAppointmentRescheduled
      title: dock-scheduling DockAppointmentRescheduled (consumed)
      summary: dock-scheduling moved a dock appointment to a new window and possibly a new door.
      description: |
        `type` = `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentRescheduled`,
        source `/warehouse/dock-scheduling`; key and subject = `appointment_id`.
        `data` is snake_case. The copy takes `door_code`, `window_start` and
        `window_end` at `version` (ADR 0020); `previous_door_code` is logged,
        and `site_id`, `previous_window_*` and `arrival_tolerance_minutes` are
        ignored. Receipts already open keep their door.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/DockSchedulingAppointmentRescheduledEvent"
      examples:
        - name: rescheduled
          summary: The carrier is two hours late and is moved to another door.
          payload:
            specversion: "1.0"
            id: "8c2f4a1e-3b5d-4e7f-9a60-1d2c3b4a5e6f"
            source: "/warehouse/dock-scheduling"
            type: "com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentRescheduled"
            subject: "appt-123e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-09T07:30:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:dock-scheduling:events:DockAppointmentRescheduled:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              site_id: "WH1"
              door_code: "WH1-DOCK-IN-03"
              previous_door_code: "WH1-DOCK-IN-01"
              window_start: "2026-10-09T10:00:00Z"
              window_end: "2026-10-09T12:00:00Z"
              previous_window_start: "2026-10-09T08:00:00Z"
              previous_window_end: "2026-10-09T10:00:00Z"
              arrival_tolerance_minutes: 15
              version: 2
    DockSchedulingAppointmentDoorReassigned:
      name: DockAppointmentDoorReassigned
      title: dock-scheduling DockAppointmentDoorReassigned (consumed)
      summary: The appointment's door was reassigned (the window is unchanged).
      description: |
        `type` = `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentDoorReassigned`,
        source `/warehouse/dock-scheduling`; key and subject = `appointment_id`.
        The copy takes `to_door_code` at `version` (ADR 0020);
        `from_door_code` is logged, not checked. dock-scheduling is moving this
        type onto its integration topic; until then it never arrives and the
        consumer does not depend on it. Receipts already open keep their door.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/DockSchedulingAppointmentDoorReassignedEvent"
      examples:
        - name: reassigned
          summary: The booked door is blocked; the yard sends the truck to door 04.
          payload:
            specversion: "1.0"
            id: "2a7e9c4b-6d1f-4b38-8e25-9f0a1b2c3d4e"
            source: "/warehouse/dock-scheduling"
            type: "com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentDoorReassigned"
            subject: "appt-123e4567-e89b-12d3-a456-426614174000"
            time: "2026-10-09T07:50:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:dock-scheduling:events:DockAppointmentDoorReassigned:v1"
            data:
              appointment_id: "appt-123e4567-e89b-12d3-a456-426614174000"
              site_id: "WH1"
              from_door_code: "WH1-DOCK-IN-01"
              to_door_code: "WH1-DOCK-IN-04"
              version: 3
    ASNRegistered:
      x-no-consumer-reason: "planned warehouse-planning consumer not built (K28)"
      name: ASNRegistered
      title: ASN registered
      summary: A supplier's advance ship notice was registered.
      description: "`type` = `com.warehouse.wms.inbound-receiving.asn.ASNRegistered`; subject and key = the ASN number."
      contentType: application/cloudevents+json
      tags:
        - name: asn
      payload:
        $ref: "#/components/schemas/ASNRegisteredEvent"
      examples:
        - name: registered
          summary: ASN-1001 with two lines.
          payload:
            specversion: "1.0"
            id: "7c1f3a52-0d4e-4b8a-9e61-2a5d8f0c3b14"
            source: "/warehouse/inbound-receiving"
            type: "com.warehouse.wms.inbound-receiving.asn.ASNRegistered"
            subject: "ASN-1001"
            time: "2026-10-08T12:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inbound-receiving:events:ASNRegistered:v1"
            data:
              asn_number: "ASN-1001"
              supplier_ref: "ACME"
              expected_arrival: "2026-10-09T08:00:00Z"
              lines:
                - { line_no: 1, sku: "SKU-1", expected_qty: 40 }
                - { line_no: 2, sku: "SKU-2", expected_qty: 5 }

    ASNCancelled:
      x-no-consumer-reason: "planned warehouse-planning consumer not built (K28)"
      name: ASNCancelled
      title: ASN cancelled
      summary: A Registered ASN was cancelled.
      description: "`type` = `com.warehouse.wms.inbound-receiving.asn.ASNCancelled`; subject and key = the ASN number."
      contentType: application/cloudevents+json
      tags:
        - name: asn
      payload:
        $ref: "#/components/schemas/ASNCancelledEvent"
      examples:
        - name: cancelled
