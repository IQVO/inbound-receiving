# Local dependencies for cmd/api, cmd/mcp and cmd/inbound-projector:
# Postgres AND Kafka are the only runtime (ADR 0011), there is no in-memory
# mode. `docker compose up -d --wait` then, for example:
#
#   export DATABASE_URL='postgres://inbound:inbound@localhost:5437/inbound_receiving?sslmode=disable'
#   export KAFKA_BROKERS='localhost:9092'
#   export PRODUCT_CONSUMER_GROUP=inbound-receiving-product
#   export DOCK_DOOR_CONSUMER_GROUP=inbound-receiving-dock-doors
#   go run ./cmd/api
#
# The broker (confluent-local, KRaft, single node) advertises localhost:9092
# to the host and auto-creates topics on first write, like the cluster does.
# (Port 9092 is also what the kind cluster's Kafka publishes on the host: stop
# one of the two, or map this one elsewhere and advertise the same address.)
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: inbound
      POSTGRES_PASSWORD: inbound
      POSTGRES_DB: inbound_receiving
    ports:
      - "5437:5432"
    volumes:
      - inbound_receiving_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbound"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/confluent-local:7.6.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  inbound_receiving_pg_data:
