{{- if .Values.a2a.enabled }}
{{- include "inbound-receiving.requireDatabase" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inbound-receiving.a2aFullname" . }}
  labels:
    {{- include "inbound-receiving.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "inbound-receiving.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "inbound-receiving.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "inbound-receiving.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "inbound-receiving.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/a2a/main.go: A2A_ADDR,
          # A2A_AGENT_URL (MANDATORY), DATABASE_URL (MANDATORY), (migration
          # step only) MIGRATIONS_DATABASE_URL, LOG_LEVEL, SERVICE_VERSION,
          # ENVIRONMENT and OTEL_EXPORTER_OTLP_ENDPOINT. cmd/a2a is READ-ONLY
          # like cmd/mcp (docs/adr/0016): it has no auth env, no outbox
          # writer, starts no outbox relay, runs no local-copy consumer and
          # never dials Kafka (no KAFKA_BROKERS, no EVENT_PUBLISHER, no
          # consumer groups, no DOCK_DOOR_MODE here). It reads the same
          # Postgres as the api and has no database-less mode.
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            # MANDATORY (docs/adr/0016): the absolute URL advertised on the
            # Agent Card. Defaults to this release's in-cluster Service DNS and
            # is overridable through a2a.agentUrl.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%v/" (include "inbound-receiving.a2aFullname" .) .Release.Namespace .Values.a2a.service.port) | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "inbound-receiving.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/a2a runs the idempotent embedded migrations on start (like
            # the api), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "inbound-receiving.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.a2a.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # GET /healthz is served by cmd/a2a, so the probes have a cheap target.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}