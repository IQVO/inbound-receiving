# Non-secret configuration of the api component, mirrored from the env the
# Deployment renders; the Deployment's checksum/config annotation rolls the
# pods whenever any of it changes. DATABASE_URL never lands here: it lives in
# the Secret (templates/secret.yaml or database.existingSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inbound-receiving.fullname" . }}
  labels:
    {{- include "inbound-receiving.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  PRODUCT_MODE: {{ .Values.config.productMode | quote }}
  DOCK_DOOR_MODE: {{ .Values.config.dockDoorMode | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}
  PRODUCT_CONSUMER_GROUP: {{ .Values.config.productConsumerGroup | quote }}
  DOCK_DOOR_CONSUMER_GROUP: {{ .Values.config.dockDoorConsumerGroup | quote }}
  PACKAGING_CONSUMER_GROUP: {{ .Values.config.packagingConsumerGroup | quote }}
  DOCK_APPOINTMENT_CONSUMER_GROUP: {{ .Values.config.dockAppointmentConsumerGroup | quote }}
  VISIT_ARRIVAL_CONSUMER_GROUP: {{ .Values.config.visitArrivalConsumerGroup | quote }}
  CARTON_STOW_CONSUMER_GROUP: {{ .Values.config.cartonStowConsumerGroup | quote }}
  CARTON_MAX_GROSS_WEIGHT_G: {{ .Values.config.cartonMaxGrossWeightG | int64 | quote }}
  CARTON_MAX_LONGEST_SIDE_MM: {{ .Values.config.cartonMaxLongestSideMm | int64 | quote }}
  {{- /* ADR 0024: both are optional and rendered only when set. */}}
  {{- with .Values.config.receivingSiteGlns }}
  RECEIVING_SITE_GLNS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.receiverGs1CompanyPrefix }}
  {{- if not (regexMatch "^[0-9]{7,10}$" (toString .)) }}
  {{- fail "config.receiverGs1CompanyPrefix must be 7 to 10 digits (a GS1 company prefix, ADR 0024)" }}
  {{- end }}
  RECEIVER_GS1_COMPANY_PREFIX: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.config.outboxRelayInterval }}
  OUTBOX_RELAY_INTERVAL: {{ . | quote }}
  {{- end }}
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  HOUSEKEEPING_INTERVAL: {{ .Values.config.housekeepingInterval | quote }}
  IDEMPOTENCY_KEY_TTL: {{ .Values.config.idempotencyKeyTTL | quote }}
  OUTBOX_RETENTION: {{ .Values.config.outboxRetention | quote }}
  PROCESSED_EVENTS_RETENTION: {{ .Values.config.processedEventsRetention | quote }}
  RECEIVING_ADVICE_SLA: {{ .Values.config.receivingAdviceSla | quote }}
  {{- with .Values.config.shutdownDrainDelay }}
  SHUTDOWN_DRAIN_DELAY: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ . | quote }}
  {{- end }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  {{- end }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
