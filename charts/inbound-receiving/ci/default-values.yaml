  url: "postgres://u@example.invalid:5432/db"
kafka:
  brokers: "kafka.example.invalid:9092"
config:
  productConsumerGroup: "inbound-receiving-product"
  dockDoorConsumerGroup: "inbound-receiving-dock-doors"
