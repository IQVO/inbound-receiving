# Default values for inbound-receiving.

replicaCount: 1

# The image is NEVER pulled from a registry in the local kind cluster: it is
# built from the local checkout and side-loaded with `kind load docker-image`
# (warehouse-infra overrides repository and tag with a content-derived
# local-<hash> tag). `pullPolicy: IfNotPresent` is required there, or the
# kubelet tries to pull from Docker Hub and ImagePullBackOffs. The same image
# carries both binaries: /app/api (this Deployment) and /app/mcp.
image:
  repository: warehouse/inbound-receiving
  pullPolicy: IfNotPresent
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: inbound-receiving.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress: block above.
# Same shape as every other chart in this fleet. Routes only to this chart's
# main REST API Service -- the same Service ingress.yaml targets.
# warehouse-infra turns it on and supplies the Kong Gateway parentRef + path.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

# Kong plugins rendered by THIS chart (kong-plugins.yaml) and attached to
# every HTTPRoute above via the konghq.com/plugins annotation. Fleet
# decision 2026-10-13: Kong configuration belongs to the application
# charts, not warehouse-infra Terraform. Defaults off; warehouse-infra's
# values switch them on. NO auth plugin here, ever — the fleet's endpoints
# are unauthenticated and the gateway adds no authentication or
# authorization.
kongPlugins:
  cors:
    enabled: false
    # Exact browser origin, never "*" (endpoints are unauthenticated).
    origin: "http://localhost"
  prometheus:
    enabled: false
  opentelemetry:
    enabled: false
    # OTLP/HTTP traces endpoint of the fleet collector; needs Kong started
    # with KONG_TRACING_INSTRUMENTATIONS or the plugin exports zero spans.
    tracesEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) for the api Deployment, disabled by
# default so nothing changes replica behaviour silently. When enabled, the
# Deployment's replicaCount is omitted so the HPA is the sole owner of
# .spec.replicas. N>1 is safe for the outbox relay (FOR UPDATE SKIP LOCKED),
# the version-guarded aggregate writes (concurrent-modification on conflict) and
# the local-copy consumers (stable consumer groups, dedupe on the CloudEvents id
# in the same transaction); it has not been load-tested. mcp deliberately has
# no block here: the MCP Streamable-HTTP handler keeps per-process session
# state and the mcp Service has no session affinity (see mcp: below).
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# deployment.environment.name on every span, metric and log (ENVIRONMENT).
environment: "local"

# Environment read by cmd/api/main.go. Every key maps 1:1 to one env var.
config:
  httpAddr: ":8080"                  # HTTP_ADDR
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn (or warning) | error
  # CORS_ALLOWED_ORIGINS (comma-separated). Empty = not rendered, so the
  # binary's own local-dev default applies. In the kind cluster Kong's global
  # CORS plugin handles browsers; set this only for a direct-to-pod caller.
  corsAllowedOrigins: ""
  # EVENT_PUBLISHER: "kafka" is the ONLY publisher (ADR 0011): the outbox
  # always drains onto warehouse.inbound-receiving.events and the analytics
  # topic. The key is kept because warehouse-infra sets it; "log" is refused
  # at render time and by the binary at boot.
  eventPublisher: "kafka"
  # OUTBOX_RELAY_INTERVAL: Go duration ("500ms", "2s") or plain seconds.
  # Empty = not rendered; the binary defaults to 1s.
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS (gap fix D12, docs/adr/0007): how many times one
  # outbox row may fail before the relay excludes it from claims, so a
  # poison row cannot block the relay forever. The excluded row stays in
  # outbox_events (attempts, last_error) until an operator re-arms it with
  # `UPDATE outbox_events SET attempts = 0 WHERE id = ...`. 0 = unlimited.
  outboxMaxAttempts: 20
  # Housekeeping sweeper (gap fix D24, docs/adr/0010). Go durations (or plain
  # seconds); 0 disables that part. The api sweeps idempotency_keys,
  # PUBLISHED outbox_events (unpublished rows are never swept) and
  # processed_events; the projector sweeps analytics_processed_events with
  # housekeepingInterval and processedEventsRetention.
  # HOUSEKEEPING_INTERVAL: how often the sweeper runs (0 = sweeper off).
  housekeepingInterval: "1h"
  # IDEMPOTENCY_KEY_TTL: how long a cached Idempotency-Key response is kept.
  idempotencyKeyTTL: "24h"
  # OUTBOX_RETENTION: how long a published outbox row is kept for forensics.
  outboxRetention: "168h"
  # PROCESSED_EVENTS_RETENTION: how long a consumer dedupe mark is kept.
  # Keep it above the consumed topics' retention (Kafka default 7 days): an
  # older redelivery would be applied again.
  processedEventsRetention: "720h"
  # PRODUCT_MODE (ADR 0003, ADR 0011): "kafka" is the ONLY mode. The local
  # SKU copy, fed from warehouse.product-master.events, is always enforced
  # when an ASN is registered, and the product consumer always runs.
  # "permissive"/"off" were removed: the chart refuses them at render time
  # and the binary at boot. The key is kept because docs and infra set it.
  productMode: "kafka"
  # PRODUCT_CONSUMER_GROUP: the product consumer's STABLE group id, so a
  # rescheduled pod resumes from its committed offsets. REQUIRED (the chart
  # refuses an empty one; the binary exits at boot without it).
  productConsumerGroup: ""
  # DOCK_DOOR_MODE (ADR 0003, ADR 0011): "kafka" is the only mode. The local
  # inbound-door copy, fed from warehouse.facility.events, is always enforced
  # when an appointment is booked.
  dockDoorMode: "kafka"
  # DOCK_DOOR_CONSUMER_GROUP: the dock-door consumer's STABLE group id.
  # REQUIRED, like productConsumerGroup.
  dockDoorConsumerGroup: ""
  # PACKAGING_CONSUMER_GROUP (ADR 0012): the PackagingView consumer's STABLE group id
  # (product-master pack-level events). REQUIRED, like productConsumerGroup.
  packagingConsumerGroup: ""
  # CARTON_MAX_GROSS_WEIGHT_G / CARTON_MAX_LONGEST_SIDE_MM (ADR 0014): the
  # CartonOverLimit handling limits, in grams and millimetres, checked against
  # a carton's DECLARED weight and longest side at acceptance. 0 = unchecked.
  # An over-limit carton is still accepted; the finding is raised.
  cartonMaxGrossWeightG: 0
  cartonMaxLongestSideMm: 0
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before closing the
  # listener. Empty = not rendered; the binary defaults to 5s.
  shutdownDrainDelay: ""

# MANDATORY (ADR 0011: Postgres is the only runtime). The chart refuses to
# render unless database.url or database.existingSecret is set
# (templates/_helpers.tpl: inbound-receiving.requireDatabase).
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup step
  # (cmd/api and cmd/mcp) -- never for the runtime pgxpool, which always uses
  # existingSecretKey/DATABASE_URL. golang-migrate takes a session-scoped
  # pg_advisory_lock that PgBouncer's transaction pooling cannot honour.
  # `optional: true` on the rendered secretKeyRef so a secret without this key
  # still starts the pod: the binary falls back to DATABASE_URL.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# MANDATORY (ADR 0011: Kafka is the only runtime). kafka.brokers (comma
# separated) is rendered as KAFKA_BROKERS into the api and the projector, and
# the chart refuses to render without it; there is no default broker.
# kafka.enabled is kept only so values written before ADR 0011 still render
# (warehouse-infra sets it to true): it may be true or absent, never false.
# Produced topics: warehouse.inbound-receiving.events and
# warehouse.inbound-receiving.analytics; consumed: warehouse.product-master.events
# and warehouse.facility.events. The service never creates topics itself: the
# broker auto-creates them on first write.
kafka:
  enabled: true
  brokers: ""

# OpenTelemetry traces + metrics, pushed over OTLP/gRPC to a Collector. The
# endpoint below is the in-cluster Collector Service in the warehouse-infra
# kind cluster. Export is non-blocking, so a Collector that is down costs
# telemetry and nothing else; otel.enabled=false skips the env entirely.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"

# Extra env vars appended to the api container as a raw list. It may not set
# an EVENT_PUBLISHER other than "kafka" nor any *_MODE variable (the chart
# refuses both: ADR 0011).
extraEnv: []

# The Postgres dial (migrations + ping) at boot is wrapped in a bounded retry
# (internal/bootretry: 5 attempts, 1+2+4+8 = 15 s of backoff in total, no
# sleep after the last attempt). periodSeconds * failureThreshold gives a ~60s window
# before the kubelet gives up. Once startupProbe succeeds, liveness takes
# over; readiness uses the separate /readyz endpoint (flipped to not-ready as
# the FIRST step of graceful shutdown).
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's graceful shutdown: SHUTDOWN_DRAIN_DELAY (default 5s)
# + HTTP drain (10s) + consumers drain (10s) + outbox relay drain (10s),
# sequential, worst case ~35s.
terminationGracePeriodSeconds: 40

# --- MCP server (docs/adr/0005) ---
# The Model Context Protocol server (cmd/mcp, Streamable HTTP only, READ-ONLY
# tools). DISABLED by default. Enabling it renders its own Deployment +
# Service (component=mcp) over the same OLTP database, served at "/" and
# "/mcp" with GET /healthz probes, command /app/mcp. Env names in
# templates/mcp-deployment.yaml match cmd/mcp/main.go. It starts no outbox
# relay and dials no Kafka. No auth / API key: MCP servers are
# unauthenticated fleet-wide.
#
# Deliberately NOT HPA-scalable (no autoscaling.mcp block): the SDK's
# StreamableHTTPHandler keeps in-memory, per-process MCP session state and
# the mcp Service has no session affinity, so a second replica could receive
# a mid-session request its own process never created.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure of the MCP server (mcp-route.yaml): host path
  # /api/mcp/<context> rewritten to /mcp. Off by default; warehouse-infra
  # turns it on with the real parentRefs and path.
  route:
    enabled: false
    path: "/api/mcp/inbound-receiving"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- A2A agent (docs/adr/0016) ---
# The Agent2Agent agent (cmd/a2a, JSON-RPC over HTTP, READ-ONLY skills
# asn_receiving_status and dock_schedule): the third driving adapter over the
# SAME read use cases as the REST and MCP surfaces. A2A carries delegation of
# a goal only; facts between contexts still travel as CloudEvents on Kafka.
# DISABLED by default. Enabling it renders its own Deployment + Service
# (component=a2a) over the same OLTP database, served at "/" and "/a2a" with
# the Agent Card at /.well-known/agent-card.json and GET /healthz probes,
# command /app/a2a. Env names in templates/a2a-deployment.yaml match
# cmd/a2a/main.go. Like the MCP server it is read-only: it writes no outbox
# row, starts no outbox relay and dials no Kafka. No auth / API key: A2A
# endpoints are unauthenticated fleet-wide.
a2a:
  enabled: false
  replicaCount: 1
  # A2A_ADDR the binary listens on; keep in sync with service.targetPort.
  # (8090 is the MCP server, 8091 the projector admin and 8092 the reports
  # API, so 8093.)
  httpAddr: ":8093"
  # Absolute URL advertised on the Agent Card (A2A_AGENT_URL, mandatory for the
  # binary). Empty defaults to this release's in-cluster Service DNS
  # (http://<release>-a2a.<ns>.svc.cluster.local:8093/); warehouse-infra can
  # override it with the Kong path when the agent must be reachable off-cluster.
  agentUrl: ""
  service:
    type: ClusterIP
    port: 8093
    targetPort: 8093
  # Kong exposure of the A2A agent (a2a-route.yaml): host path
  # /api/a2a/<context> rewritten to / (the JSON-RPC root; the well-known agent
  # card stays reachable under the same prefix). Off by default; warehouse-infra
  # turns it on with the real parentRefs and path.
  route:
    enabled: false
    path: "/api/a2a/inbound-receiving"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- Analytics read side (docs/adr/0006) ---
# The receiving performance and accuracy data product: cmd/inbound-projector
# consumes warehouse.inbound-receiving.analytics (written by the SAME outbox
# as the integration topic) into a SEPARATE analytical database, and
# cmd/inbound-reports serves GET /reports/receiving-performance and
# /reports/freshness read-only from it. DISABLED by default (the default
# render is unchanged). Enabling it renders component=analytics-projector
# (Deployment) and component=analytics-reports (Deployment + Service
# <release>-reports), plus the analytics Secret. Requires a DSN source (the
# chart refuses to render otherwise) and kafka.brokers (mandatory for the
# whole chart).
analytics:
  enabled: false
  database:
    # The projector's read-write analytical DSN (DIRECT Postgres, not
    # PgBouncer: it also runs the embedded analytical migrations). No password
    # in committed values.
    projectorUrl: ""
    # The reports reader's DSN -- a read-only role where possible; falls back
    # to projectorUrl when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret holding ANALYTICS_DATABASE_URL (projector) and
    # ANALYTICS_READER_DATABASE_URL (reports). Takes precedence over the URLs.
    existingSecret: ""
  projector:
    # One replica is enough; N>1 is safe: one fixed group shares the
    # partitions and every write dedupes on the CloudEvents id in the same
    # transaction.
    replicaCount: 1
    adminAddr: ":8091"                  # ADMIN_ADDR (/healthz, /readyz)
    # ANALYTICS_CONSUMER_GROUP: the projector's FIXED consumer group. A stable
    # id lets a rescheduled pod resume from its committed offsets; a brand-new
    # group starts at the earliest offset and rebuilds the model from history.
    consumerGroup: "inbound-receiving-analytics"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"                   # HTTP_ADDR
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    # Kong exposure of the reports API (reports-route.yaml): host path
    # /api/<context>/reports rewritten to /reports. Off by default;
    # warehouse-infra turns it on with the real parentRefs and path.
    route:
      enabled: false
      path: "/api/inbound-receiving/reports"
      parentRefs:
        - name: ""
          namespace: ""
          sectionName: "http"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# --- frontend (Module Federation REMOTE `inbound_mfe`) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod (component=frontend). In the kind cluster it is
# reached through warehouse-infra's Nginx web gateway at
# http://localhost/mfes/inbound-receiving/ -- never through Kong, which serves
# APIs only. The remote reads its API origin at runtime from the console's
# /config.json (`${apiOrigin}/api/inbound-receiving`), so nothing about it is
# configured here. No ingress/httproute for it and the Service stays ClusterIP:
# frontend path routing is owned by the Nginx web gateway.
#
# Disabled by default so existing releases are unaffected; warehouse-infra sets
# frontend.enabled=true and supplies the locally built image tag (image built
# from web/Dockerfile; side-loaded into kind, so keep pullPolicy IfNotPresent).
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/inbound-receiving-frontend
    pullPolicy: IfNotPresent
    # Empty = the chart's appVersion. warehouse-infra overrides it.
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
