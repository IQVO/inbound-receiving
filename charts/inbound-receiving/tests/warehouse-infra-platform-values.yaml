# Mirrors warehouse-infra's helm-values/_platform.yaml (origin/develop,
# 2026-10-19), the FIRST values file of every ArgoCD Application. Used with
# warehouse-infra-values.yaml by `render_test.sh`: see that file.
gatewayApi:
  parentRefs: &gateway
    - name: warehouse-gateway
      namespace: kong
      sectionName: http

mcp:
  route:
    parentRefs: *gateway

a2a:
  route:
    parentRefs: *gateway

analytics:
  reports:
    route:
      parentRefs: *gateway

kongPlugins:
  cors:
    origin: http://localhost
  opentelemetry:
    tracesEndpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces

kafka:
  brokers: kafka.warehouse-systems.svc.cluster.local:9092
